<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Conquests</title>
  <meta name="description" content="My Conquests — a private space for your stories, your stats, and the people you choose to share them with." />
  <meta name="theme-color" content="#0D0D10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--midnight:#0D0D10;--ivory:#F5F1EA;--red:#D84A5B;--grey:#96949C;--border:rgba(245,241,234,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ivory);background:var(--midnight);-webkit-font-smoothing:antialiased}body{min-height:100svh;overflow:hidden;background:var(--midnight)}a{color:inherit;text-decoration:none}.page{height:100svh;min-height:560px;display:grid;grid-template-rows:auto 1fr auto;background:var(--midnight)}.shell{width:min(1120px,calc(100% - 40px));margin:0 auto}header{position:relative;z-index:5}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}.status{display:inline-flex;align-items:center;gap:9px;color:var(--grey);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 16px rgba(216,74,91,.65)}main{min-height:0;display:grid;place-items:center;text-align:center;padding:0 0 8px}.hero{display:flex;flex-direction:column;align-items:center;max-width:760px;margin:auto;transform:translateY(-1.5vh)}.logo-wrap{width:clamp(150px,21vh,220px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:-4px}.logo{width:100%;height:100%;display:block;object-fit:contain}h1{margin:0;font-size:clamp(38px,5.4vw,68px);line-height:1.02;letter-spacing:-.055em;font-weight:500}.accent{color:var(--red)}.lede{margin:20px auto 0;max-width:650px;color:rgba(245,241,234,.64);font-size:clamp(14px,1.5vw,17px);line-height:1.6}.cta-row{display:flex;justify-content:center;gap:10px;margin-top:27px}.store-btn{min-width:154px;height:48px;padding:0 18px;border-radius:13px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--ivory);display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:500;cursor:default}.store-btn span{color:var(--grey);font-size:9px;text-transform:uppercase;letter-spacing:.12em}.privacy-note{margin-top:20px;color:rgba(150,148,156,.62);font-size:10px;letter-spacing:.16em;text-transform:uppercase}footer{position:relative;z-index:5}.footer-inner{min-height:58px;border-top:1px solid rgba(245,241,234,.07);display:flex;align-items:center;justify-content:space-between;color:rgba(150,148,156,.72);font-size:11px}.footer-links{display:flex;gap:19px}.footer-links a{padding:4px 0;transition:color .2s ease}.footer-links a:hover{color:var(--ivory)}@media(max-width:720px){body{overflow:auto}.page{height:auto;min-height:100svh}.shell{width:min(100% - 28px,1120px)}.nav{height:62px}.brand{font-size:10px}.status{font-size:9px}main{padding:30px 0 36px}.hero{transform:none}.logo-wrap{width:clamp(128px,19vh,180px)}h1{font-size:clamp(34px,11vw,48px)}.lede{max-width:420px;margin-top:16px;font-size:13px;line-height:1.55}.cta-row{margin-top:20px}.store-btn{min-width:135px;height:44px;padding:0 13px;font-size:12px}.privacy-note{margin-top:15px}.footer-inner{min-height:70px}.footer-inner>div:first-child{display:none}.footer-links{width:100%;justify-content:center;flex-wrap:wrap;gap:10px 18px}}@media(max-height:700px) and (min-width:721px){.nav{height:58px}.logo-wrap{width:125px}.lede{margin-top:14px}.cta-row{margin-top:18px}.privacy-note{margin-top:13px}.footer-inner{min-height:48px}}@media(max-height:580px) and (min-width:721px){.logo-wrap{width:96px}h1{font-size:34px}.lede{font-size:12px;line-height:1.45}.store-btn{height:40px}.privacy-note{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="page">
    <header><div class="shell nav"><div class="brand">My Conquests</div><div class="status">Coming soon</div></div></header>
    <main><section class="shell hero"><div class="logo-wrap"><img class="logo" src="assets/MyConquests_Logo_Dark_2048.png" alt="My Conquests monogram" /></div><h1>Every story is<br><span class="accent">yours to tell</span></h1><p class="lede">Keep your memories &nbsp;·&nbsp; Discover your stats &nbsp;·&nbsp; Share your stories</p><div class="cta-row" aria-label="App availability"><div class="store-btn">App Store <span>Soon</span></div><div class="store-btn">Google Play <span>Soon</span></div></div><div class="privacy-note">Built for privacy</div></section></main>
    <footer><div class="shell footer-inner"><div>© <span id="year"></span> My Conquests</div><div class="footer-links"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/community-guidelines.html">Safety</a><a href="mailto:support@myconquests.com">Support</a><a href="/delete-account.html">Delete account</a></div></div></footer>
  </div>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
