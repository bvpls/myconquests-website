<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Conquests</title>
  <meta name="description" content="My Conquests — a private space for your stories, your stats, and the people you choose to share them with." />
  <meta name="theme-color" content="#0D0D10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--midnight:#0D0D10;--ivory:#F5F1EA;--red:#D84A5B;--grey:#96949C;--border:rgba(245,241,234,.10)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ivory);background:var(--midnight);-webkit-font-smoothing:antialiased}
    body{min-height:100svh;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(216,74,91,.085),transparent 31rem),var(--midnight)}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .page{height:100svh;min-height:560px;display:grid;grid-template-rows:auto 1fr auto}
    .shell{width:min(1120px,calc(100% - 40px));margin:0 auto}
    header{position:relative;z-index:5}
    .nav{height:76px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
    .status{display:inline-flex;align-items:center;gap:9px;color:var(--grey);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
    .status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 16px rgba(216,74,91,.65)}
    main{min-height:0;display:grid;place-items:center;text-align:center;padding:0 0 8px}
    .hero{display:flex;flex-direction:column;align-items:center;max-width:760px;margin:auto;transform:translateY(-1.5vh)}
    .logo-wrap{width:clamp(150px,21vh,220px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:-4px}
    .logo{width:100%;height:100%;display:block;object-fit:contain}
    h1{margin:0;font-size:clamp(38px,5.4vw,68px);line-height:1.02;letter-spacing:-.055em;font-weight:500}
    .accent{color:var(--red)}
    .lede{margin:20px auto 0;max-width:570px;color:rgba(245,241,234,.64);font-size:clamp(14px,1.5vw,17px);line-height:1.6}
    .cta-row{display:flex;justify-content:center;gap:10px;margin-top:27px}
    .store-btn{min-width:154px;height:48px;padding:0 18px;border-radius:13px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--ivory);display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:500;cursor:default}
    .store-btn span{color:var(--grey);font-size:9px;text-transform:uppercase;letter-spacing:.12em}
    .privacy-note{margin-top:20px;color:rgba(150,148,156,.62);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
    footer{position:relative;z-index:5}
    .footer-inner{min-height:58px;border-top:1px solid rgba(245,241,234,.07);display:flex;align-items:center;justify-content:space-between;color:rgba(150,148,156,.72);font-size:11px}
    .footer-links{display:flex;gap:22px}
    .footer-links button,.footer-links a{border:0;padding:4px 0;background:none;color:inherit;cursor:pointer;transition:color .2s ease}
    .footer-links button:hover,.footer-links a:hover{color:var(--ivory)}
    .modal-backdrop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(5,5,7,.72);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}
    .modal-backdrop.open{opacity:1;visibility:visible}
    .modal{width:min(520px,100%);padding:28px;border:1px solid rgba(245,241,234,.11);border-radius:22px;background:#151519;box-shadow:0 24px 80px rgba(0,0,0,.42);text-align:left;transform:translateY(8px) scale(.985);transition:transform .2s ease}
    .modal-backdrop.open .modal{transform:none}
    .modal-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
    .modal h2{margin:0;font-size:20px;font-weight:500;letter-spacing:-.025em}
    .close{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--grey);font-size:20px;line-height:1;cursor:pointer}
    .modal p{margin:0;color:var(--grey);font-size:14px;line-height:1.7}
    .modal .coming{margin-top:18px;color:var(--red);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    @media(max-width:620px){
      .shell{width:min(100% - 28px,1120px)}
      .nav{height:62px}.brand{font-size:10px}.status{font-size:9px}
      main{padding-bottom:0}.hero{transform:translateY(-1vh)}
      .logo-wrap{width:clamp(128px,19vh,180px)}
      h1{font-size:clamp(34px,11vw,48px)}
      .lede{max-width:420px;margin-top:16px;font-size:13px;line-height:1.55}
      .cta-row{margin-top:20px}.store-btn{min-width:135px;height:44px;padding:0 13px;font-size:12px}
      .privacy-note{margin-top:15px}
      .footer-inner{min-height:52px}.footer-inner>div:first-child{display:none}.footer-links{width:100%;justify-content:center;gap:26px}
    }
    @media(max-height:700px){.nav{height:58px}.logo-wrap{width:125px}.lede{margin-top:14px}.cta-row{margin-top:18px}.privacy-note{margin-top:13px}.footer-inner{min-height:48px}}
    @media(max-height:580px){.logo-wrap{width:96px}h1{font-size:34px}.lede{font-size:12px;line-height:1.45}.store-btn{height:40px}.privacy-note{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="page">
    <header><div class="shell nav"><div class="brand">My Conquests</div><div class="status">Coming soon</div></div></header>
    <main>
      <section class="shell hero">
        <div class="logo-wrap"><img class="logo" src="assets/MyConquests_Logo_Dark_2048.png" alt="My Conquests monogram" /></div>
        <h1>Every story is<br><span class="accent">yours to tell.</span></h1>
        <p class="lede">A private space to keep your conquests, explore your own stats and share only what you choose — with the people you choose.</p>
        <div class="cta-row" aria-label="App availability"><div class="store-btn">App Store <span>Soon</span></div><div class="store-btn">Google Play <span>Soon</span></div></div>
        <div class="privacy-note">Built for privacy</div>
      </section>
    </main>
    <footer><div class="shell footer-inner"><div>© <span id="year"></span> My Conquests</div><div class="footer-links"><button type="button" data-modal="privacy">Privacy</button><button type="button" data-modal="terms">Terms</button><a href="mailto:support@myconquests.com">Support</a></div></div></footer>
  </div>

  <div class="modal-backdrop" id="infoModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-top"><h2 id="modalTitle"></h2><button class="close" type="button" aria-label="Close">×</button></div>
      <p id="modalText"></p><div class="coming">Full policy coming before launch</div>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent=new Date().getFullYear();
    const modal=document.getElementById('infoModal');
    const title=document.getElementById('modalTitle');
    const text=document.getElementById('modalText');
    const copy={
      privacy:['Privacy','My Conquests is being built with privacy at its core. The complete privacy policy, including clear details on data handling and sharing, will be published here before the public launch.'],
      terms:['Terms','The complete Terms of Use for My Conquests will be published here before the public launch.']
    };
    function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
    document.querySelectorAll('[data-modal]').forEach(btn=>btn.addEventListener('click',()=>{const item=copy[btn.dataset.modal];title.textContent=item[0];text.textContent=item[1];modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.querySelector('.close').focus()}));
    document.querySelector('.close').addEventListener('click',closeModal);
    modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  </script>
</body>
</html>
